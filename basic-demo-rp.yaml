
apiVersion: placement.kubernetes-fleet.io/v1
kind: ResourcePlacement
metadata:
  name: rp-rollout-flux-aks-store-demo
  namespace: aks-store-demo
spec:
  resourceSelectors:

    - group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
      name: store-helm-repo

    - group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: store-helm-release

  policy:
    placementType: PickFixed
    clusterNames:
    - aks-member-place-01-fm
    # - kind-kf-member-01
    # - kind-kf-member-02