apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aks-store-demo-app
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/aks-store/overlays/fleet
  prune: true
  wait: true
  serviceAccountName: aks-store-reconciler
  sourceRef:
    kind: OCIRepository
    name: aks-store-demo
