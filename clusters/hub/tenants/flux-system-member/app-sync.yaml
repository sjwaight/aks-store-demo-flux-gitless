apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system-member-install
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/flux-system/member
  prune: true
  serviceAccountName: flux-system-member-reconciler
  sourceRef:
    kind: OCIRepository
    name: aks-store-demo
