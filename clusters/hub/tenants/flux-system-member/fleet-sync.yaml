apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system-member-placement
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./fleet/placements/flux-system
  prune: true
  serviceAccountName: flux-system-member-reconciler
  dependsOn:
    - name: flux-system-member-install
  sourceRef:
    kind: OCIRepository
    name: aks-store-demo
