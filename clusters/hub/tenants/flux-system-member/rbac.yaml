apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-system-member-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-system-member-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  # RBAC self-escalation checks require this SA to already hold every permission it grants
  # via the vendored flux-install.yaml ClusterRole (wildcard verbs on the Flux CRD groups),
  # so bind to cluster-admin rather than a narrower custom ClusterRole.
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: flux-system-member-reconciler
    namespace: flux-system
