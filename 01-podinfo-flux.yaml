apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: flux-system
  labels:
    app.kubernetes.io/name: podinfo
    fleet-demo: podinfo
spec:
  interval: 1m
  url: oci://ghcr.io/YOUR_GITHUB_ORG/podinfo-manifests
  ref:
    tag: 1.0.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
  labels:
    app.kubernetes.io/name: podinfo
    fleet-demo: podinfo
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: podinfo
  path: ./
  postBuild:
    substitute:
      PODINFO_REPLICAS: "1"
      PODINFO_ENVIRONMENT: "default"
      PODINFO_UI_COLOR: "#34577c"